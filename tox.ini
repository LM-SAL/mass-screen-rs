[tox]
min_version = 4
envlist =
    py{312,313,314}
    codestyle
isolated_build = true

[testenv]
package = wheel
wheel_build_env = .pkg
change_dir = .tmp/{envname}
description = run tests
extras =
    tests
commands =
    pip freeze --all --no-input
    pytest -vvv -r fEs --pyargs mass_screen_rs {posargs}

[testenv:codestyle]
pypi_filter =
skip_install = true
description = Run all style and file checks with prek
deps =
    prek
commands =
    prek prepare-hooks --color always
    prek run --color always --all-files --show-diff-on-failure {posargs}
